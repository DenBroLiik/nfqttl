# Nfqttl Eclipse 4.3 — kernel-first, low idle activity
TTL=64
BACKEND=auto
WORKERS=1
DOWNSTREAMS=""
UPSTREAMS=""
DISABLE_OFFLOAD=1
IPV6_MODE=auto
IPV6_HL=64
MAX_FAILURES=6
COOLDOWN=1
QUEUE_MAXLEN=4096
RCVBUF_MB=8
MAX_BACKLOG=3072
STALL_LIMIT=3
WATCHDOG_MS=500
IDLE_MS=10000
RESCAN_MS=10000
CHECK_MS=5000
# 0: segment oversized GSO packets rather than receive truncated skb copies
GSO=0

# Optional CAKE shaping: 0 disables. Requires rebuilt kernel, explicit interfaces.
SQM_UP_KBIT=0
SQM_DOWN_KBIT=0
SQM_UP_IFACE=""
SQM_DOWN_IFACE=""
