# Nfqttl Eclipse 3.0 configuration
# IPv4 TTL visible on the cellular uplink after forwarding.
TTL=64

# auto: native kernel TTL target first, otherwise multi-queue userspace worker.
# kernel: require native TTL target.
# nfqueue: force userspace fallback.
BACKEND=auto

# NFQUEUE fallback workers. Eclipse/stone has 8 CPUs; 4 is a good high-throughput default.
# Values 1..8. If --queue-balance is unavailable the module falls back to 1 automatically.
WORKERS=4

# Empty = auto-detect interfaces. Space-separated exact names can override detection.
DOWNSTREAMS=""
UPSTREAMS=""

# Android tether offload can bypass netfilter, so keep it disabled for consistent TTL handling.
# Software forwarding on stone is preferred over leaking unmodified tether packets.
DISABLE_OFFLOAD=1

# IPv6 policy for tethered clients:
# auto      = normalize hop-limit when kernel HL target exists, otherwise block forwarded IPv6
# normalize = require HL --hl-set 64
# block     = block forwarded IPv6 from tether clients (prevents IPv6 hop-limit/address leakage)
# pass      = do not touch IPv6
IPV6_MODE=auto
IPV6_HL=64

# Supervisor tuning. Packet drops alone no longer disable TTL.
MAX_FAILURES=6
COOLDOWN=3
MAX_BACKLOG=768
STALL_LIMIT=3
